<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="meas_crowd pipeline flow">
<title>meas_crowd pipeline flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0a6"/></marker></defs>
<rect width="760" height="486" fill="#ffffff"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#202124" text-anchor="start">Each cutout loops fit, then refit, until sources and PSF stop changing</text>
<rect x="24" y="52" width="200" height="57" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="124.0" y="75" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">1. Setup</text>
<text x="124.0" y="95" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">cutouts, bad-pixel mask, PSF</text>
<rect x="280" y="52" width="200" height="57" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="380.0" y="75" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">2. Gaia catalogue</text>
<text x="380.0" y="95" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">starting positions from DR3</text>
<rect x="536" y="52" width="200" height="57" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="636.0" y="75" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">3. Preparation</text>
<text x="636.0" y="95" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">mask, PSF wings, Gaia offset</text>
<path d="M224 80H280" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M480 80H536" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M636 108V122H290V136" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24" y="136" width="532" height="160" rx="8" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="40" y="160" font-size="14" font-weight="bold" fill="#202124" text-anchor="start">4. Outer pass (PSF and background fixed)</text>
<rect x="40" y="176" width="156" height="91" rx="8" fill="#e8f0fe" stroke="#3b6fc4" stroke-width="2"/>
<text x="118.0" y="199" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Inner loop</text>
<text x="118.0" y="219" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">detect, fit, clean up;</text>
<text x="118.0" y="236" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">lower the threshold</text>
<text x="118.0" y="253" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">until the residual is clean</text>
<rect x="212" y="176" width="156" height="91" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="290.0" y="199" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Clean-up</text>
<text x="290.0" y="219" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">remove halo / ring fakes,</text>
<text x="290.0" y="236" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">polish positions,</text>
<text x="290.0" y="253" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">split pairs, fit galaxies</text>
<rect x="384" y="176" width="156" height="91" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="462.0" y="199" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Noise + PSF check</text>
<text x="462.0" y="219" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">add missing photon noise</text>
<text x="462.0" y="236" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">to the variance;</text>
<text x="462.0" y="253" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="middle">measure the PSF error</text>
<path d="M196 222H212" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M368 222H384" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M556 222H582" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<polygon points="582,222 642,180 702,222 642,264" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="642" y="218" font-size="12" font-weight="normal" fill="#202124" text-anchor="middle">5. Changed</text>
<text x="642" y="234" font-size="12" font-weight="normal" fill="#202124" text-anchor="middle">less than 1%?</text>
<text x="712" y="212" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">yes</text>
<path d="M702 222H722V398" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="652" y="290" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="start">no</text>
<path d="M642 264V340H452" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="172" y="312" width="280" height="57" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="312.0" y="335" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">6. Refit for the next pass</text>
<text x="312.0" y="355" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">background (tilted plane), PSF from stars</text>
<path d="M312 312V296" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="536" y="398" width="200" height="74" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="636.0" y="421" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">7. Outputs</text>
<text x="636.0" y="441" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">photometry catalogue with</text>
<text x="636.0" y="458" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">Gaia comparison, files</text>
<rect x="24" y="398" width="490" height="57" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.25"/>
<text x="269.0" y="421" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">8. Whole detector: fitTiles, then stitchTiles</text>
<text x="269.0" y="441" font-size="12" font-weight="normal" fill="#5f6368" text-anchor="middle">400 px tiles with 30 px pad, then one mosaic + one catalogue</text>
<path d="M80 398V296" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="90" y="344" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="start">each tile</text>
<text x="90" y="359" font-size="11" font-weight="normal" fill="#5f6368" text-anchor="start">runs 1 to 7</text>
</svg>
