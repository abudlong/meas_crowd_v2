[flake8]
max-line-length = 110
max-doc-length = 110
# N813 / N817: the short module aliases (fitLib as L, fastKernels as fk) are kept on purpose
ignore = E133, E226, E228, N802, N803, N806, N812, N813, N815, N816, N817, W503, W504, E741
per-file-ignores =
    # the driver keeps the column-aligned option comments of the original notebook code
    python/lsst/meas/crowd/pipeline.py: E262, E702, E131, E127, E128, E306, E501, E731, F841
    python/lsst/meas/crowd/plotting.py: E127, E501
    tests/*.py: E127, E501, E731
exclude =
    __init__.py,
    tests/.tests,
    python/lsst/meas/crowd/fitLib.py,
    python/lsst/meas/crowd/adaptive.py,
    python/lsst/meas/crowd/session.py

[pydocstyle]
convention = numpy
match_dir = (?!tests|\.).*

[tool:pytest]
testpaths = tests
